# Add a DAO tracking code from a dashboard, without opening the integration
# options — the no-account way to start following a parcel.
#
# Requirements:
#   - the DAO integration set up with its "Tracking codes" source (an
#     account entry registers no actions, because it has no code list)
#   - an input_text helper to type the code into; create it in
#     Settings -> Devices & services -> Helpers, or with the YAML below
#
# Put the helper and the script on a dashboard side by side (an Entities
# card with the input_text and the script) and the whole flow is: paste the
# number from the shipping confirmation, press the button.

input_text:
  dao_tracking_code:
    name: DAO tracking code
    max: 40
    icon: mdi:barcode

script:
  dao_track_typed_code:
    alias: "DAO: track the typed code"
    sequence:
      - condition: template
        value_template: "{{ states('input_text.dao_tracking_code') | trim != '' }}"
      - action: dao.track_parcel
        data:
          tracking_code: "{{ states('input_text.dao_tracking_code') | trim }}"
      # Clear the field so the next code starts from an empty box. The
      # parcel's own sensor appears within a poll or two; DAO answers
      # "not found" for a code it has not registered yet, which shows up
      # as a parcel sitting on `unknown` rather than an error.
      - action: input_text.set_value
        target:
          entity_id: input_text.dao_tracking_code
        data:
          value: ""
    mode: single

# Housekeeping: stop following everything that has been delivered. DAO never
# re-fetches a delivered parcel, so this is purely about tidying the entity
# list — run it from a dashboard button, or on a schedule.
  dao_untrack_delivered:
    alias: "DAO: untrack delivered parcels"
    sequence:
      - repeat:
          for_each: >-
            {{ state_attr('sensor.dao_delivered_parcels', 'parcels')
               | default([], true) | map(attribute='barcode') | list }}
          sequence:
            - action: dao.untrack_parcel
              data:
                tracking_code: "{{ repeat.item }}"
    mode: single
